<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta name="theme-color" content="#1f3a8a">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ root }}assets/img/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
  <link rel="stylesheet" href="{{ root }}assets/css/style.css?v={{ version }}">
  <script src="{{ root }}assets/js/site.js?v={{ version }}" defer></script>
{{ head_extra }}
</head>
<body class="{{ body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ root }}" aria-label="Marco Ledda, home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8"></rect>
          <path pathLength="1" d="M5.5 23.5H8L8.71 22.49 9.42 19.95 10.13 16.62 10.85 13.22 11.56 10.28 12.27 8.15 12.98 6.96 13.69 6.68 14.4 7.14 15.12 8.08 15.83 9.25 16.54 10.41 17.25 11.39 17.96 12.08 18.67 12.43 19.38 12.48 20.1 12.29 20.81 11.95 21.52 11.54 22.23 11.14 22.94 10.82 23.65 10.6 24.37 10.49 25.08 10.49 25.79 10.57 26.5 10.69"></path>
        </svg>
        <span>Marco Ledda</span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul>
{{ nav }}
        </ul>
      </nav>
      <div class="header-tools">
        <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"></path></svg>
        </button>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer class="site-footer">
{{ footer_art }}
    <div class="container footer-inner">
      <div class="footer-id">
        <p class="footer-name">Marco Ledda</p>
        <p>{{ footer_role }}</p>
        <p><a href="mailto:{{ email }}">{{ email }}</a></p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul>
{{ nav }}
        </ul>
      </nav>
      <p class="footer-meta">Last updated {{ updated }} &middot; &copy; {{ year }} Marco Ledda</p>
    </div>
  </footer>
</body>
</html>
