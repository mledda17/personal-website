# Research interests shown as cards on the homepage.
# icon: one of "certify", "adversarial", "sysid"
[[interest]]
title  = "Certification of learning-based autonomous systems"
text   = "Optimization-based worst-case analysis of neural models and learning-enabled controllers, turning reliability questions into certifiable bounds."
icon   = "certify"

[[interest]]
title  = "Adversarial learning in control systems"
text   = "Optimized, bounded perturbations of inputs, measurements and stored histories that expose the fragile directions of learned dynamical models."
icon   = "adversarial"

[[interest]]
title  = "Learning-based system identification"
text   = "Structured neural state-space models and exact links between ReLU networks and piecewise-affine dynamical systems."
icon   = "sysid"

