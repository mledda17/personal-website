title       = "Marco Ledda"
description = "Marco Ledda, Ph.D. candidate in Systems and Control at the University of Cagliari: certification of learning-enabled systems, adversarial perturbations, learning-based system identification."
news_on_home = 5          # how many news items appear on the homepage

[profile]
name        = "Marco Ledda"
role        = "Ph.D. Candidate in Systems and Control"
department  = "Department of Electrical and Electronic Engineering (DIEE)"
department_url = "https://web.unica.it/unica/en/dip_ingelettrica.page"
university  = "University of Cagliari"
address     = "Piazza d'Armi, 09123 Cagliari, Italy"
photo       = "assets/img/marco-ledda.jpg"
email       = "marco.ledda2@unica.it"

# Short biography shown on the homepage (supports **bold**, *italic* and [text](url)).
bio = """
Marco Ledda is a Ph.D. candidate in Systems and Control at the University of Cagliari, Italy. He earned his Bachelor's degree in Electrical, Electronic, and Computer Engineering from the University of Cagliari in 2022, followed by a Master's degree in Computer Engineering, Cybersecurity, and Artificial Intelligence, graduating with honors in 2024 from the same institution.

His research focuses on the **certification and safety of learning-enabled autonomous systems**, with particular emphasis on learning-based control, neural-network-based system modeling, and robustness to adversarial perturbations. His work aims at developing analysis and verification methodologies that provide formal or quantitative guarantees for data-driven components deployed in safety-critical control and autonomous systems.
"""

