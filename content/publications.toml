# ---------------------------------------------------------------------------
# Publications.
#
# Each [[publication]] needs:  id, category, title, authors, venue, year.
# Optional fields:
#   status      "accepted" | "to appear" | "under review"   (shown as a tag)
#   place       city/country of the conference
#   pages       e.g. "401-406"
#   doi         DOI without the https://doi.org/ prefix (title then links to it)
#   url         link for the title when there is no DOI (e.g. arXiv page)
#   manuscript  path to the PDF (put the file in files/papers/)
#   code        link to the code repository
#   short       compact venue tag used on cards, e.g. "IEEE CDC 2026"
#   logo        image in assets/logos/  (logo_url: where the logo links to)
#   logo_text   text tile used when no logo image is available
#   logo_fill   true -> the logo image covers the whole tile (use it for logos
#               with a coloured background); otherwise it is fitted with padding
#   logo_note   small ribbon on the logo tile (e.g. "Under review")
#   note        extra line under the venue (supports [text](url))
#   reader      creates a page at /<reader>/ to read the PDF online
#   thumbnail   first-page image in assets/thumbs/ (used on the homepage)
#   selected    true -> appears in "Selected publications" on the homepage
#   abstract, bibtex
#
# Slides are linked automatically from content/talks.toml (field "paper").
# Homepage order follows the order of this file; the Publications page
# groups papers by category and sorts them by label (newest first).
# ---------------------------------------------------------------------------

