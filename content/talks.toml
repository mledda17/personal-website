# ---------------------------------------------------------------------------
# Talks.  Every talk with a "slug" gets its own page at /slides/<slug>/
# (the URL printed on the title slide), which embeds the PDF in "slides".
#
# date:   "YYYY-MM-DD" or "YYYY-MM"
# kind:   free text, e.g. "Conference", "National congress", "Seminar"
# paper:  label of the related paper in publications.toml (adds a Slides
#         button to that paper automatically)
# authors: co-authors of the talk (the speaker is you)
# ---------------------------------------------------------------------------

